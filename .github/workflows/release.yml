name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: node --test test/

      - name: Compilar binários
        run: |
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64; do
            ext=""; [ "$target" = windows-x64 ] && ext=".exe"
            mkdir -p "build/$target"
            bun build --compile --minify --target="bun-$target" src/server.ts --outfile "build/$target/chatgpt-local-api$ext"
          done

      - name: Pacote Node (script isolado)
        run: |
          node scripts/package-node.mjs
          mkdir -p release
          (cd dist && mv node chatgpt-local-api-node && zip -qr ../release/chatgpt-local-api-node.zip chatgpt-local-api-node)

      - name: Compactar
        run: |
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            cp README.md "build/$target/"
            tar -czf "release/chatgpt-local-api-$target.tar.gz" -C "build/$target" chatgpt-local-api README.md
          done
          cp README.md build/windows-x64/
          (cd build/windows-x64 && zip -q "../../release/chatgpt-local-api-windows-x64.zip" chatgpt-local-api.exe README.md)
          (cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/*
          if-no-files-found: error

  smoke-test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, archive: chatgpt-local-api-linux-x64.tar.gz }
          - { os: macos-13, archive: chatgpt-local-api-darwin-x64.tar.gz }
          - { os: macos-latest, archive: chatgpt-local-api-darwin-arm64.tar.gz }
          - { os: windows-latest, archive: chatgpt-local-api-windows-x64.zip }
          - { os: windows-latest, archive: chatgpt-local-api-node.zip, node: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Extrair
        shell: bash
        run: |
          mkdir bin
          case "${{ matrix.archive }}" in
            *.zip) unzip -q "release/${{ matrix.archive }}" -d bin ;;
            *) tar -xzf "release/${{ matrix.archive }}" -C bin ;;
          esac
      - name: Subir a API e consultar
        if: ${{ !matrix.node }}
        shell: bash
        env:
          CHATGPT_API_PORT: '8788'
          CHATGPT_API_NO_OPEN: '1'
          CHATGPT_API_DATA_DIR: ${{ runner.temp }}/cla-data
        run: |
          exe=./bin/chatgpt-local-api; [ -f "$exe.exe" ] && exe="$exe.exe"
          "$exe" help
          "$exe" status
          "$exe" serve > serve.log 2>&1 &
          for _ in $(seq 1 20); do curl -fs http://127.0.0.1:8788/health && break; sleep 1; done
          curl -fs http://127.0.0.1:8788/health
          curl -fs http://127.0.0.1:8788/api/tags
          cat serve.log

      - uses: actions/setup-node@v4
        if: ${{ matrix.node }}
        with:
          node-version: 22
      - name: Testar start.bat (pacote Node)
        if: ${{ matrix.node }}
        shell: cmd
        env:
          CHATGPT_API_PORT: '8788'
          CHATGPT_API_NO_OPEN: '1'
          CHATGPT_API_DATA_DIR: ${{ runner.temp }}\cla-data
        run: |
          call bin\chatgpt-local-api-node\start.bat help
          start /b bin\chatgpt-local-api-node\start.bat serve
          curl --retry 15 --retry-delay 1 --retry-connrefused -fs http://127.0.0.1:8788/health

  publish:
    needs: smoke-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Criar o Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
